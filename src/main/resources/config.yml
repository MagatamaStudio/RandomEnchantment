# RandomEnchantment 插件配置文件
# 在此配置文件中设置各种工具和装备可被附魔的属性与附魔数量

# 附魔数量设置 (每个物品可以获得的附魔数量范围)
enchantment-count:
  default: 1-3  # 默认的附魔数量范围
  swords: 1-4   # 剑类武器可以获得更多附魔
  armor: 2-4    # 防具类可以获得更多附魔
  tools: 1-3    # 工具类 (镐、铲、斧等)
  fishing_rod: 1-2  # 钓鱼竿
  bow: 1-3      # 弓
  crossbow: 1-3 # 弩

# 各类型物品可获得的附魔列表
# 格式: 物品类型: [附魔类型1, 附魔类型2, ...]
# 物品类型参考: SWORD, AXE, PICKAXE, SHOVEL, HOE, HELMET, CHESTPLATE, LEGGINGS, BOOTS, BOW, CROSSBOW, FISHING_ROD, TRIDENT

# 剑类附魔
sword-enchantments:
  - DAMAGE_ALL     # 锋利
  - DAMAGE_UNDEAD  # 亡灵杀手
  - DAMAGE_ARTHROPODS  # 节肢杀手
  - KNOCKBACK      # 击退
  - FIRE_ASPECT    # 火焰附加
  - LOOT_BONUS_MOBS  # 抢夺
  - SWEEPING_EDGE  # 横扫之刃
  - MENDING        # 经验修补
  - UNBREAKING     # 耐久
  - CURSE_OF_VANISHING  # 消失诅咒

# 镐类附魔
pickaxe-enchantments:
  - DIG_SPEED      # 效率
  - SILK_TOUCH     # 精准采集
  - DURABILITY     # 耐久 (注意这里是DURABILITY，不是UNBREAKING)
  - LOOT_BONUS_BLOCKS  # 时运
  - MENDING        # 经验修补
  - CURSE_OF_VANISHING  # 消失诅咒
  - EFFICIENCY     # 效率 (某些版本使用EFFICIENCY而不是DIG_SPEED)
  - UNBREAKING     # 耐久 (某些版本使用UNBREAKING而不是DURABILITY)

# 斧类附魔
axe-enchantments:
  - DIG_SPEED      # 效率
  - SILK_TOUCH     # 精准采集
  - DURABILITY     # 耐久
  - LOOT_BONUS_BLOCKS  # 时运
  - MENDING        # 经验修补
  - UNBREAKING     # 耐久
  - EFFICIENCY     # 效率
  - CURSE_OF_VANISHING  # 消失诅咒

# 铲类附魔

  - DIG_SPEED      # 效率
  - SILK_TOUCH     # 精准采集
  - DURABILITY     # 耐久
  - LOOT_BONUS_BLOCKS  # 时运
  - MENDING        # 经验修补
  - UNBREAKING     # 耐久
  - EFFICIENCY     # 效率
  - CURSE_OF_VANISHING  # 消失诅咒

# 头盔附魔

  - PROTECTION_ENVIRONMENTAL  # 保护
  - PROTECTION_FIRE      # 火焰保护
  - PROTECTION_FALL      # 摔落保护
  - PROTECTION_PROJECTILE  # 弹射物保护
  - PROTECTION_EXPLOSIONS  # 爆炸保护
  - OXYGEN        # 水下呼吸
  - WATER_WORKER  # 水下速掘
  - THORNS        # 荆棘
  - MENDING       # 经验修补
  - UNBREAKING    # 耐久
  - CURSE_OF_BINDING  # 绑定诅咒
  - CURSE_OF_VANISHING  # 消失诅咒


  - LURE          # 诱饵
  - LUCK_OF_THE_SEA  # 海之眷顾
  - MENDING       # 经验修补
  - UNBREAKING    # 耐久
  - CURSE_OF_VANISHING  # 消失诅咒

# 是否允许重复附魔 (同一物品上出现相同类型的附魔)
allow-duplicate-enchantments: false

# 是否强制使用本插件的附魔机制，替代原版附魔机制
force-random-enchantment: true

# 是否允许为所有物品附魔 (包括原版不可附魔的物品)
allow-all-items-enchantment: false

# 调试模式 (启用后会在控制台输出更多信息)
debug-mode: false
